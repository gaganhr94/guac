# Gitpod workspace configuration for a self-hosted trial of GUAC.
#
# On workspace start this pulls the published GUAC release image and
# brings up the full service stack (GraphQL, REST, collectsub, ingestor,
# collectors, NATS) with the in-memory GraphQL backend via
# docker-compose. The GraphQL playground is previewed on port 8080 and
# the REST API is exposed on 8081.
#
# To use the persistent ent/PostgreSQL backend instead, replace
# `container_files/mem.yaml` with `container_files/ent.yaml` in the
# compose command below.
#
# See https://docs.guac.sh/ for ingestion and query examples.

image: gitpod/workspace-full:latest

tasks:
  - name: GUAC services
    env:
      GUAC_IMAGE: ghcr.io/guacsec/guac:v1.1.0
      GUAC_API_PORT: "8080"
    init: |
      docker pull "$GUAC_IMAGE"
    command: |
      docker compose -f docker-compose.yml -f container_files/mem.yaml up -d
      echo ""
      echo "Waiting for the GraphQL server on :8080 ..."
      counter=0
      until curl --silent --head --fail http://localhost:8080 >/dev/null; do
        [ $counter -ge 60 ] && { echo "GUAC did not become ready in time"; docker compose logs --tail=100; exit 1; }
        sleep 2; counter=$((counter+1))
      done
      echo ""
      echo "GUAC is ready."
      echo "  - GraphQL playground: open the preview for port 8080"
      echo "  - REST API:           port 8081 (e.g. /healthz)"
      echo "  - Tail logs:          docker compose logs -f"
      echo "  - Stop:               docker compose down"

ports:
  - port: 8080
    name: GraphQL
    description: GUAC GraphQL server and playground
    onOpen: open-preview
    visibility: public
  - port: 8081
    name: REST API
    description: GUAC REST API server
    onOpen: notify
    visibility: public
  - port: 2782
    name: CollectSub
    description: Collector subscription service (internal)
    onOpen: ignore
    visibility: private
  - port: 4222
    name: NATS client
    description: NATS JetStream client port (internal)
    onOpen: ignore
    visibility: private
  - port: 8222
    name: NATS monitoring
    description: NATS server monitoring endpoint
    onOpen: ignore
    visibility: private

vscode:
  extensions:
    - golang.go
    - graphql.vscode-graphql
    - graphql.vscode-graphql-syntax
    - ms-azuretools.vscode-docker

github:
  prebuilds:
    master: true
    branches: true
    pullRequests: true
    pullRequestsFromForks: false
    addCheck: false
    addComment: false
    addBadge: false
